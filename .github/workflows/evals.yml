name: Evals

# Never on push or pull_request. Every case is a real model call, so a
# per-PR eval bills a provider on every commit and — worse — makes a noisy
# score into a merge blocker. Manual only for now (the schedule is below,
# commented out), which is also the argument `ci.yml` already makes for keeping
# Playwright out.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'propose, card, or both'
        type: choice
        options: [both, propose, card]
        default: both
      repeat:
        description: 'Runs per case. Above 1 measures flakiness, and costs that multiple.'
        default: '1'
  # The weekly schedule is off, because it can never pass here.
  #
  # It ran every Monday and failed every time, under thirty seconds in, on
  # "OPENAI_API_KEY is not set": the repository has no such secret, and the one
  # key the project has is approved for the app only — never for evals, never
  # as a CI secret. A job whose precondition is ruled out by policy is not a
  # signal, just a red mark a week that nobody can act on.
  #
  # Run the evals locally (`pnpm eval`), or by hand from the Actions tab once a
  # separate, eval-only key is stored as the `ANTHROPIC_API_KEY` secret. Restore
  # the cron line in the same change that adds that secret — the point of a
  # schedule is noticing that the model behind these calls changed before a
  # user does.
  # schedule:
  #   # Mondays, 06:00 UTC.
  #   - cron: '0 6 * * 1'

jobs:
  eval:
    name: score the propose and card calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The harness imports @auto-learn/shared, same as both apps.
      - name: Build shared
        run: pnpm --filter @auto-learn/shared build

      # Cheap, deterministic, and the thing that decides whether the scores
      # below mean anything. A broken scorer reports a number nobody re-derives.
      - name: Test the scorers
        run: pnpm --filter @auto-learn/evals test

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pnpm --filter @auto-learn/evals eval \
            ${{ github.event.inputs.suite == 'both' && ' ' || github.event.inputs.suite }} \
            --repeat=${{ github.event.inputs.repeat || 1 }}

      # Uploaded whether or not the run regressed: the failure is the reason
      # you want the outputs, and they are gitignored locally.
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-runs
          path: evals/results/runs/
          retention-days: 30
