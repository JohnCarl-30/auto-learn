# Render blueprint for the API. The web app goes to Vercel — see docs/deploy.md.
#
# Why Render: the API cannot be serverless — it holds a session between
# /propose writing a proposal and /card opening one of its gates.
#
# `numInstances: 1` is now a choice rather than a constraint. Sessions live in
# Redis when REDIS_URL is set, so a card request can land in a process that
# never saw the proposal. Telemetry counters and rate-limiter state are still
# per-process: the counters would under-report across instances and the limits
# would be per-instance, neither of which breaks anything the way a missing
# session did. Raise the count when there is traffic to justify it.
services:
  - type: keyvalue
    name: auto-learn-sessions
    plan: starter
    region: oregon
    # Sessions only. Nothing here needs to survive the instance itself, and an
    # eviction is a resubmit rather than lost work.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


  - type: web
    name: auto-learn-api
    runtime: node
    plan: starter # Not free: the free tier sleeps, and sleeping resets the counters.
    region: oregon
    numInstances: 1
    healthCheckPath: /health

    # packages/shared compiles to dist and the API imports the built output, so
    # nothing else builds until this has run.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @auto-learn/shared build &&
      pnpm --filter api build
    startCommand: node apps/api/dist/main.js

    envVars:
      - key: OPENAI_API_KEY
        sync: false # Set in the dashboard. Never in this file.
      - key: WEB_ORIGIN
        sync: false # The Vercel URL, once the web app has one.
      # Voice. Without these, dictation and spoken pronunciation refuse;
      # everything else — including the dictionary's own recordings — works.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: NODE_VERSION
        value: 22
      # Without this the API keeps sessions in memory and still works —
      # correctly, on exactly one instance.
      - key: REDIS_URL
        fromService:
          name: auto-learn-sessions
          type: keyvalue
          property: connectionString
